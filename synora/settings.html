<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080611">
<title>Settings · SYNORA</title>
<link rel="stylesheet" href="styles.css">
<style>
body{min-height:100vh;background:var(--bg,#080611);color:var(--text,#fff);padding:24px 16px}
.settings-page{max-width:760px;margin:30px auto}
.settings-page .back{display:inline-flex;margin-bottom:24px;padding:11px 16px;border:1px solid var(--line,#ffffff22);border-radius:12px;color:inherit;text-decoration:none;background:var(--surface,#171322)}
.settings-page h1{font-size:clamp(30px,6vw,44px);margin:0 0 8px}
.settings-page .intro{color:var(--muted,#aaa);margin:0 0 26px}
.settings-card{display:grid;gap:22px;padding:24px;border:1px solid var(--line,#ffffff22);border-radius:20px;background:var(--surface,#171322)}
.setting-row{display:grid;gap:9px}
.setting-row label{font-weight:700}
.setting-row p{margin:0;color:var(--muted,#aaa);font-size:14px}
.setting-row select{width:100%;min-height:48px;padding:10px 13px;border-radius:11px;border:1px solid var(--line,#ffffff22);background:var(--surface2,#211b30);color:var(--text,#fff);font:inherit}
</style>
</head>
<body>
<main class="settings-page">
<a class="back" href="index.html">← Back to Home</a>
<div class="eyebrow">PREFERENCES</div>
<h1>Settings</h1>
<p class="intro">Personalise your SYNORA workspace.</p>
<section class="settings-card">
<div class="setting-row"><label for="languageSelect">Language</label><p>Choose a language for the translated view.</p>
<select id="languageSelect"><option value="">Choose language</option><option value="bn">বাংলা</option><option value="as">অসমীয়া</option><option value="hi">हिन्दी</option><option value="en">English</option><option value="ar">العربية</option><option value="zh-CN">中文（简体）</option><option value="zh-TW">中文（繁體）</option><option value="ja">日本語</option><option value="ko">한국어</option><option value="es">Español</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="pt">Português</option><option value="ru">Русский</option><option value="it">Italiano</option><option value="nl">Nederlands</option><option value="tr">Türkçe</option><option value="ur">اردو</option><option value="ta">தமிழ்</option><option value="te">తెలుగు</option><option value="ml">മലയാളം</option><option value="kn">ಕನ್ನಡ</option><option value="mr">मराठी</option><option value="gu">ગુજરાતી</option><option value="pa">ਪੰਜਾਬੀ</option><option value="ne">नेपाली</option><option value="th">ไทย</option><option value="vi">Tiếng Việt</option><option value="id">Bahasa Indonesia</option><option value="ms">Bahasa Melayu</option><option value="fa">فارسی</option></select></div>
<div class="setting-row"><label for="themeSelect">Colour Theme</label><p>Choose one of 15 colour themes. Your choice is saved on this device.</p>
<select id="themeSelect"><option value="dark">Ultra Dark</option><option value="midnight">Midnight Purple</option><option value="white-glow">White Glow</option><option value="ocean">Ocean Blue</option><option value="emerald">Emerald Glow</option><option value="rose">Rose Pink</option><option value="ruby">Ruby Red</option><option value="sunset">Sunset Orange</option><option value="gold">Golden Glow</option><option value="sky">Sky Blue</option><option value="cyan">Cyan Neon</option><option value="lavender">Lavender Dream</option><option value="mint">Mint Green</option><option value="cherry">Cherry Blossom</option><option value="amoled">AMOLED Black</option></select></div>
</section>
</main>
<script>
const names=['midnight','white-glow','ocean','emerald','rose','ruby','sunset','gold','sky','cyan','lavender','mint','cherry','amoled'];
const select=document.getElementById('themeSelect');
function applyTheme(theme){document.body.classList.remove(...names.map(n=>n+'-theme'));if(names.includes(theme))document.body.classList.add(theme+'-theme');select.value=theme;localStorage.setItem('synora.theme',theme);}
const saved=localStorage.getItem('synora.theme')||'dark';applyTheme(['dark',...names].includes(saved)?saved:'dark');
select.addEventListener('change',()=>applyTheme(select.value));
document.getElementById('languageSelect').addEventListener('change',e=>{if(e.target.value){localStorage.setItem('synora.language',e.target.value);const target=location.origin+location.pathname.replace(/settings\.html$/,'index.html');location.href='https://translate.google.com/translate?sl=auto&tl='+encodeURIComponent(e.target.value)+'&u='+encodeURIComponent(target);}});
</script>
</body>
</html>
